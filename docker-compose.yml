services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ssf_guide
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssf -d ssf_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ssf:${DB_PASSWORD}@db:5432/ssf_guide?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-ssf.digitalsolutionnepal.com}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      # Always reachable locally — lets an existing web server on the VPS
      # (nginx/apache/panel) reverse-proxy to the app on shared machines.
      - "127.0.0.1:3001:3000"

  caddy:
    image: caddy:2
    # Only started with `--profile edge` — skip on VPSes where another
    # web server already owns ports 80/443.
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-ssf.digitalsolutionnepal.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
