name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [main, claude/ssf-guide-setup-vm4w43]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required repository secrets (Settings → Secrets and variables → Actions):
    #   VPS_HOST        VPS IP address
    #   VPS_USER        SSH user (usually root)
    #   VPS_SSH_KEY     private key whose public half is on the VPS
    #   GEMINI_API_KEY  Ask SSF AI key (written to the VPS .env on first deploy)
    # Optional:
    #   SITE_DOMAIN     defaults to ssf.digitalsolutionnepal.com
    #   WHATSAPP_NUMBER defaults to empty
    steps:
      - name: Bootstrap & deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BRANCH,REPO,TOKEN,GEMINI_API_KEY,SITE_DOMAIN,WHATSAPP_NUMBER
          script: |
            set -e
            APP_DIR=/opt/ssf-guide

            # --- first-run bootstrap (shared-VPS safe: never enables a
            # firewall, never stops or reconfigures existing services) ---
            if ! command -v docker >/dev/null 2>&1; then
              echo "==> Installing Docker"
              apt-get update -qq && apt-get install -y -qq ca-certificates curl git
              curl -fsSL https://get.docker.com | sh
            fi
            # Only ADD allow-rules if a firewall is already active
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> First deploy: cloning repository"
              git clone --branch "$BRANCH" "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"

            # ephemeral token per deploy — nothing persistent stored on the VPS
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git remote set-url origin "https://github.com/${REPO}.git"

            # --- .env (created once; GEMINI key updated if provided) ---
            if [ ! -f .env ]; then
              DB_PASSWORD_GEN=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
              {
                echo "DB_PASSWORD=${DB_PASSWORD_GEN}"
                echo "SITE_DOMAIN=${SITE_DOMAIN:-ssf.digitalsolutionnepal.com}"
                echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
                echo "WHATSAPP_NUMBER=${WHATSAPP_NUMBER}"
              } > .env
              chmod 600 .env
            elif [ -n "$GEMINI_API_KEY" ]; then
              grep -q '^GEMINI_API_KEY=..*' .env || sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${GEMINI_API_KEY}|" .env
            fi

            echo "==> Building and starting"
            # Shared-VPS detection: if another web server already owns
            # ports 80/443, DO NOT start Caddy — run app+db only, bound to
            # 127.0.0.1:3001 for the existing server to reverse-proxy.
            if ss -tlnp 2>/dev/null | grep -qE '[:.](80|443)\s'; then
              echo "==> Ports 80/443 are in use by an existing web server."
              echo "==> Starting app+db only (app on 127.0.0.1:3001)."
              echo "==> Add a vhost for the domain in your existing web server"
              echo "==>   proxying to http://127.0.0.1:3001"
              docker compose up -d --build db app
            else
              echo "==> Ports 80/443 free — starting full stack with Caddy HTTPS."
              docker compose --profile edge up -d --build
            fi
            docker image prune -f
            docker compose ps
